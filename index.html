<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <h2>Button Styles</h2>
      <div class="row">
        <div class="col">
          <button type="button" class="btn btn-primary text-uppercase">
            Primary Large
          </button>
          <button type="button" class="btn btn-secondary text-lowercase">
            Secondary Small
          </button>
          <button type="button" class="btn btn-success">Success Large</button>
          <button type="button" class="btn btn-danger">Danger Button</button>
        </div>
      </div>
      <br />

      <div class="row">
        <div class="col">
          <button type="button" class="btn btn-danger btn-xs">
            Large Success Button
          </button>

          <button type="button" class="btn btn-info btn-xs">
            Small Danger Button
          </button>
        </div>
      </div>

      <br />

      <div class="row">
        <div class="col">
          <button
            type="button"
            class="btn btn-default border-primary text-primary"
          >
            Outline Primary Button
          </button>
        </div>
      </div>
      <br />
      <div class="btn-group" role="group">
        <button type="button" class="btn btn-warning">left</button>
        <button type="button" class="btn btn-warning">Middle</button>
        <button type="button" class="btn btn-warning btn-disabled">
          Right
        </button>
      </div>
    </div>
    <br />

    <div class="row row-cols-lg-3">
      <div class="col">
        <img
          src="https://plus.unsplash.com/premium_photo-1700595208635-bdf834b3e811?q=80&w=2138&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          class="rounded"
          alt="image"
          width="304"
          height="236"
        />
      </div>
      <div class="col">
        <img
          src="https://plus.unsplash.com/premium_photo-1700595208635-bdf834b3e811?q=80&w=2138&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          class="rounded-circle"
          alt="rounded-image"
          width="304"
          height="236"
        />
      </div>

      <div class="col">
        <img
          src="https://plus.unsplash.com/premium_photo-1700595208635-bdf834b3e811?q=80&w=2138&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          class="img-thumbnail"
          alt="img-fluid img-thumbnail"
          width="304"
          height="236"
        />
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
